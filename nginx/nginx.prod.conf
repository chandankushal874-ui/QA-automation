# =============================================================================
# Nginx Reverse Proxy — single entry point for the entire platform
# =============================================================================
# Routes:
#   /              → frontend (port 3000)
#   /api/          → FastAPI backend (port 8000)
#   /health        → FastAPI health check (port 8000)
#   /jobs/         → FastAPI job endpoints (port 8000)
#   /screenshots/  → FastAPI screenshot serving (port 8000)
#   /rq-dashboard/ → RQ Dashboard (port 9181)
#   /minio/        → MinIO console (port 9001)
#
# NOTE: backend hostnames are resolved via Docker's embedded DNS at REQUEST
# time (resolver + variable proxy_pass), not cached at startup. Without this,
# recreating the api/frontend containers (new IPs) leaves the proxy pointing
# at stale IPs → 502 Bad Gateway.

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Docker embedded DNS — re-resolve container names as they change IPs
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── API backend ──
    location /api/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Health check ──
    location /health {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
    }

    # ── Metrics endpoint ──
    location /metrics {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
    }

    # ── FastAPI auto-docs (Swagger UI + OpenAPI schema) ──
    location /docs {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /openapi.json {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
    }

    # ── Job endpoints (reports, screenshots, videos, HAR) ──
    location /jobs {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # ── Screenshot serving ──
    location /screenshots {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
    }

    # ── RQ Dashboard (under /rq-dashboard/ to avoid conflict with frontend /dashboard/) ──
    location /rq-dashboard/ {
        set $upstream_rq http://rq-dashboard:9181/;
        proxy_pass $upstream_rq;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Frontend (catch-all) ──
    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

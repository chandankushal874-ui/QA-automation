# =============================================================================
# Cross-Browser Testing Platform — PRODUCTION Docker Compose
# =============================================================================
# One command to start the ENTIRE platform:
#   docker compose -f docker-compose.prod.yml up -d
#
# This brings up: PostgreSQL, Redis, MinIO, FastAPI API, RQ Worker,
# Fixture app, RQ Dashboard, Frontend (built static + nginx), and
# an nginx reverse proxy that ties everything together on ports 80/443.
#
# The only prerequisite: create a .env.production file (see .env.production.example)
# =============================================================================


services:
  # ─────────────────────────────────────────────────────────────────────
  # Data layer
  # ─────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cbtp-postgres
    restart: unless-stopped
    # Scaled for 20 concurrent crawls: 300 max connections
    command: postgres -c max_connections=300 -c shared_buffers=512MB -c max_worker_processes=16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbtp_prod_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-cbtp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbtp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cbtp-redis
    restart: unless-stopped
    # Scaled for 20 concurrent crawl job queues
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --timeout 0 --tcp-keepalive 60
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: cbtp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cbtp_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cbtp_minio_password_change_me}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────────
  # Application layer — ONE shared image (api / worker / fixture).
  # Multi-browser (Chromium+Firefox+WebKit) stays in that image.
  # Build once: docker compose -f docker-compose.prod.yml build api
  # ─────────────────────────────────────────────────────────────────────
  api:
    image: cbtp-app:latest
    build: .
    container_name: cbtp-api
    restart: unless-stopped
    # Scaled for concurrent users: gunicorn workers (not Playwright browsers)
    command: >
      gunicorn src.api.app:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers ${API_WORKERS:-4}
      --bind 0.0.0.0:8000
      --timeout 120
      --keep-alive 5
      --access-logfile -
      --error-logfile -
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cbtp}:${POSTGRES_PASSWORD:-cbtp_prod_password_change_me}@postgres:5432/${POSTGRES_DB:-cbtp}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-cbtp}:${POSTGRES_PASSWORD:-cbtp_prod_password_change_me}@postgres:5432/${POSTGRES_DB:-cbtp}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-cbtp_minio}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-cbtp_minio_password_change_me}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-cbtp-artifacts}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-anthropic/claude-sonnet-4.5}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - E2B_API_KEY=${E2B_API_KEY:-}
      - E2B_SANDBOX_TIMEOUT=${E2B_SANDBOX_TIMEOUT:-120}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - MAX_CRAWL_DEPTH=${MAX_CRAWL_DEPTH:-10}
      - MAX_PAGES_PER_JOB=${MAX_PAGES_PER_JOB:-1000}
      - MAX_CRAWL_TIME_SECONDS=${MAX_CRAWL_TIME_SECONDS:-3600}
      - PER_ENDPOINT_VISIT_BUDGET=${PER_ENDPOINT_VISIT_BUDGET:-5}
      - CIRCUIT_BREAKER_THRESHOLD=${CIRCUIT_BREAKER_THRESHOLD:-10}
      - FIXTURE_APP_URL=http://fixture:8090
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────────
  # Crawl Workers — N replicas = N concurrent crawls (1 job per worker).
  # Each worker runs Playwright browsers (~1-1.5 GB RAM each).
  # Set WORKER_REPLICAS in .env.production to match server capacity:
  #   20 workers ≈ 30 GB RAM | 40 workers ≈ 60 GB RAM
  # 20 concurrent users × 5 active crawls each = 100 queued jobs; workers
  # drain the queue — raise replicas (or add servers) for more parallelism.
  # ─────────────────────────────────────────────────────────────────────
  worker:
    image: cbtp-app:latest
    build: .
    # NOTE: deploy.replicas is Swarm-only and is IGNORED by
    # "docker compose up" on Docker Desktop. Scale workers with:
    #   docker compose ... up -d --scale worker=1
    # Laptop/demo: 1 worker. Server: --scale worker=4..20
    # Same image as api — no second Playwright download.
    restart: unless-stopped
    command: python src/workers/worker.py
    environment: &worker-env
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cbtp}:${POSTGRES_PASSWORD:-cbtp_prod_password_change_me}@postgres:5432/${POSTGRES_DB:-cbtp}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-cbtp}:${POSTGRES_PASSWORD:-cbtp_prod_password_change_me}@postgres:5432/${POSTGRES_DB:-cbtp}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-cbtp_minio}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-cbtp_minio_password_change_me}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-cbtp-artifacts}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-anthropic/claude-sonnet-4.5}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - E2B_API_KEY=${E2B_API_KEY:-}
      - E2B_SANDBOX_TIMEOUT=${E2B_SANDBOX_TIMEOUT:-120}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - MAX_CRAWL_DEPTH=${MAX_CRAWL_DEPTH:-10}
      - MAX_PAGES_PER_JOB=${MAX_PAGES_PER_JOB:-1000}
      - MAX_CRAWL_TIME_SECONDS=${MAX_CRAWL_TIME_SECONDS:-3600}
      - PER_ENDPOINT_VISIT_BUDGET=${PER_ENDPOINT_VISIT_BUDGET:-5}
      - CIRCUIT_BREAKER_THRESHOLD=${CIRCUIT_BREAKER_THRESHOLD:-10}
      - FIXTURE_APP_URL=http://fixture:8090
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  fixture:
    image: cbtp-app:latest
    build: .
    container_name: cbtp-fixture
    restart: unless-stopped
    # Same image; fixture is a tiny Python app (browsers unused here)
    command: python fixture_app/app.py
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rq-dashboard:
    image: eoranged/rq-dashboard:latest
    container_name: cbtp-rq-dashboard
    restart: unless-stopped
    ports:
      - "9181:9181"
    environment:
      - RQ_DASHBOARD_REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────
  # Frontend — built Vite static files served by nginx
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cbtp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  # ─────────────────────────────────────────────────────────────────────
  # Reverse proxy — single entry point (port 80)
  # Routes /api/* → FastAPI, / → frontend, /dashboard → rq-dashboard
  # ─────────────────────────────────────────────────────────────────────
  nginx-proxy:
    image: nginx:alpine
    container_name: cbtp-nginx-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
      - rq-dashboard

volumes:
  postgres_data:
  redis_data:
  minio_data:
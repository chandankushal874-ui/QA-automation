# =============================================================================
# REUSABLE composite action — drop-in QA gate for ANY repo (not just CBTP).
#
# Usage in another repo's workflow:
#   - uses: your-org/cross-browser-testing-platform/.github/actions/qa-gate@main
#     with:
#       api-url:    ${{ secrets.CBTP_API_URL }}
#       api-token:  ${{ secrets.CBTP_API_TOKEN }}
#       target:     https://my-staging.example.com
#
# Secrets needed in the consuming repo: CBTP_API_URL, CBTP_API_TOKEN.
# =============================================================================
name: "CBTP QA Gate"
description: "Crawl a target with the self-hosted CBTP platform and fail on blocking issues"

inputs:
  api-url:
    description: "CBTP API base URL"
    required: true
  api-token:
    description: "CBTP API token (cbtp_...)"
    required: true
  target:
    description: "URL to crawl"
    required: true
  max-blocking:
    description: "Max BLOCKING issues allowed"
    required: false
    default: "0"
  max-functional:
    description: "Max FUNCTIONAL issues allowed (-1 disables gate)"
    required: false
    default: "-1"
  max-pages:
    description: "Crawl page budget"
    required: false
    default: "50"
  timeout:
    description: "Seconds to wait for crawl completion"
    required: false
    default: "1800"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Run CBTP crawl gate
      shell: bash
      env:
        CBTP_API_URL: ${{ inputs.api-url }}
        CBTP_API_TOKEN: ${{ inputs.api-token }}
      run: |
        pip install --quiet "httpx>=0.27"
        curl -fsSL "${{ inputs.api-url }}/health" > /dev/null \
          || { echo "::error::CBTP API not reachable at ${{ inputs.api-url }}"; exit 2; }
        SCRIPT="$(mktemp -d)/ci_gate.py"
        curl -fsSL "${{ inputs.api-url }}/${{ inputs.script-path || 'raw/scripts/ci_gate.py' }}" \
          -o "$SCRIPT" 2>/dev/null \
          || curl -fsSL "https://raw.githubusercontent.com/${{ github.action_repository }}/main/scripts/ci_gate.py" -o "$SCRIPT"
        python "$SCRIPT" \
          --api-url "$CBTP_API_URL" \
          --token "$CBTP_API_TOKEN" \
          --target "${{ inputs.target }}" \
          --max-blocking "${{ inputs.max-blocking }}" \
          --max-functional "${{ inputs.max-functional }}" \
          --max-pages "${{ inputs.max-pages }}" \
          --timeout "${{ inputs.timeout }}"
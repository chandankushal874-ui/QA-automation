<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Feed — Fixture App</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<nav><a href="/">Home</a><a href="/infinite-scroll">Feed</a></nav>
<main>
    <h1>Infinite Scroll Feed</h1>
    <div id="feed-container"></div>
    <div id="loading" style="display:none;">Loading more...</div>
</main>
<script>
let currentPage = 1;
let isLoading = false;
async function loadMore() {
    if (isLoading) return;
    isLoading = true;
    document.getElementById('loading').style.display = 'block';
    const res = await fetch(`/api/feed?page=${currentPage}&limit=20`);
    const data = await res.json();
    const container = document.getElementById('feed-container');
    data.items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'feed-item';
        div.innerHTML = `<h3>${item.title}</h3><p>${item.content}</p>`;
        container.appendChild(div);
    });
    currentPage++;
    isLoading = false;
    document.getElementById('loading').style.display = 'none';
}
loadMore(); // Initial load
window.addEventListener('scroll', () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) loadMore();
});
</script>
</body>
</html>

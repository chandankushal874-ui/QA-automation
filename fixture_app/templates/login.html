<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Login — Fixture App</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<nav><a href="/">Home</a><a href="/about">About</a><a href="/login">Login</a></nav>
<main>
    <h1>Login</h1>
    <form id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
        <button type="submit">Log In</button>
    </form>
    <p id="login-error" style="color: red; display: none;"></p>
    <p>Or <a href="/oauth/authorize?client_id=test_client&redirect_uri=/oauth/callback&state=test">Login with OAuth</a></p>
    <input type="hidden" name="api_endpoint" value="/api/auth/login">
</main>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        if (res.ok) {
            window.location.href = '/dashboard';
        } else {
            const data = await res.json();
            document.getElementById('login-error').textContent = data.detail || 'Login failed';
            document.getElementById('login-error').style.display = 'block';
        }
    } catch (err) {
        document.getElementById('login-error').textContent = 'Network error';
        document.getElementById('login-error').style.display = 'block';
    }
});
</script>
</body>
</html>
